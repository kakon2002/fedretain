# Cross-architecture run: ImageNet-pretrained MobileNetV3-Large, SGD (momentum 0.9) as in the paper,
# depthwise kernels have no input-channel axis and are never retained. results/arch_mobilenetv3.
extends: base.yaml
out_rel: results/arch_mobilenetv3
arch: mobilenetv3
pretrained: true
pointwise: false
rounds: 20
local_epochs: 1
lr: 0.01
optimizer: sgd
seeds: [42]
methods: [fedavg, fedretain, fedbn]
stages: [arch]

# NOTE: not reported in the paper. With --pointwise the implementation treats 1x1 kernels as non-decomposable
# inside decompose(), so on this backbone almost nothing is retained while the printed saving counts the 1x1
# layers. Kept for the record; fix decompose() before drawing conclusions from this config.
