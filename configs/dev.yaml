# Development fold: centre 3 held out (never one of the paper's test centres 0, 1, 2), one seed, results/dev.
# Used to choose the warm-up length and the retained fraction before touching the test folds.
extends: base.yaml
out_rel: results/dev
folds: [3]
seeds: [42]
methods: [fedavg, fedretain]
variants:
  - {warm_start: 5}
  - {warm_start: 10}
  - {warm_start: 15}
stages: [sweep, localpred, bootstrap_runs, tables]
